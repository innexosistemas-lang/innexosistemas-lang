<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Daniel Reis — IT Support &amp; Security">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="280" rx="10" fill="#0d1117"/>
  <rect width="1200" height="280" rx="10" fill="url(#grid)"/>
  <rect x="700" width="500" height="280" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="10" fill="none" stroke="#21262d"/>

  <!-- window bar -->
  <g transform="translate(32,28)">
    <circle r="5" fill="#30363d"/><circle cx="18" r="5" fill="#30363d"/><circle cx="36" r="5" fill="#30363d"/>
    <text x="60" y="4" class="mono" font-size="12" fill="#484f58">root@helpdesk-lab: ~/tickets</text>
  </g>

  <!-- prompt -->
  <text x="64" y="92" class="mono" font-size="16" fill="#6e7681">
    <tspan fill="#3ddc97">❯</tspan> whoami
  </text>

  <!-- name -->
  <text x="62" y="158" class="mono" font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="2">DANIEL REIS</text>

  <!-- accent rule -->
  <rect x="64" y="178" width="72" height="3" fill="#3ddc97"/>

  <!-- role -->
  <text x="64" y="214" class="mono" font-size="18" fill="#8b949e" letter-spacing="1">
    IT Support <tspan fill="#30363d">/</tspan> Infra &amp; Networks <tspan fill="#30363d">/</tspan> Security Mindset
  </text>

  <text x="64" y="246" class="mono" font-size="13" fill="#484f58">
    <tspan fill="#3ddc97">❯</tspan> sudo fix --root-cause --then-harden<tspan class="cursor" fill="#3ddc97"> █</tspan>
  </text>

  <!-- right side: status box -->
  <g transform="translate(900,70)" class="mono" font-size="13">
    <rect width="236" height="150" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="16" y="28" fill="#484f58">// status</text>
    <text x="16" y="56" fill="#8b949e">focus<tspan x="96" fill="#e6edf3">suporte TI</tspan></text>
    <text x="16" y="80" fill="#8b949e">track<tspan x="96" fill="#e6edf3">infra / sec</tspan></text>
    <text x="16" y="104" fill="#8b949e">base<tspan x="96" fill="#e6edf3">Campinas, BR</tspan></text>
    <text x="16" y="128" fill="#8b949e">open_to<tspan x="96" fill="#3ddc97">help desk</tspan></text>
  </g>
</svg>
